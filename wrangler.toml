name = "ioe-creative-studio"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

# Non-sensitive configuration defaults
# Sensitive secrets (PAYSTACK_SECRET_KEY, R2_SECRET_ACCESS_KEY, SUPABASE_SERVICE_ROLE_KEY)
# MUST be set via: wrangler secret put <KEY_NAME>
[vars]
R2_BUCKET_NAME = "ioe-creative-studio-media"
