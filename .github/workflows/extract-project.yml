name: Extract IOE Project

on:
  push:
    paths:
      - 'IOE-Creative-Studio-GitHub-Ready.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf /tmp/ioe-project
          mkdir -p /tmp/ioe-project

          unzip -o "IOE-Creative-Studio-GitHub-Ready.zip" \
            -d /tmp/ioe-project

          echo "=== Extracted IOE project ==="
          find /tmp/ioe-project -maxdepth 4 -type f | sort

      - name: Detect IOE project
        run: |
          if [ -f "/tmp/ioe-project/worker.ts" ] && \
             [ -f "/tmp/ioe-project/wrangler.toml" ]; then
            echo "Cloudflare Worker project detected."
            echo "PROJECT_ROOT=/tmp/ioe-project" >> "$GITHUB_ENV"

          elif [ -f "/tmp/ioe-project/package.json" ]; then
            echo "Node/Vite project detected."
            echo "PROJECT_ROOT=/tmp/ioe-project" >> "$GITHUB_ENV"

          else
            echo "ERROR: No supported IOE project structure found."
            exit 1
          fi

      - name: Copy project files
        run: |
          echo "=== Copying IOE project ==="

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='node_modules/' \
            "$PROJECT_ROOT/" ./

      - name: Show final project structure
        run: |
          echo "=== Final IOE project structure ==="
          find . -maxdepth 3 -type f \
            ! -path './.git/*' | sort | head -300

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract IOE Creative Studio project [skip ci]"
            git push
          fi
