name: Extract IOE Project

on:
  push:
    paths:
      - 'IOE-Creative-Studio-GitHub-Ready.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf /tmp/ioe-project
          mkdir -p /tmp/ioe-project

          echo "Extracting IOE Creative Studio ZIP..."
          unzip -o "IOE-Creative-Studio-GitHub-Ready.zip" -d /tmp/ioe-project

          echo ""
          echo "Extracted files:"
          find /tmp/ioe-project -maxdepth 4 -type f | head -200

      - name: Find project root
        run: |
          echo "Searching for project root..."

          PROJECT_ROOT=""

          PACKAGE_JSON=$(find /tmp/ioe-project -name package.json -type f | head -1)

          if [ -n "$PACKAGE_JSON" ]; then
            PROJECT_ROOT=$(dirname "$PACKAGE_JSON")
          else
            WORKER_FILE=$(find /tmp/ioe-project -name worker.ts -type f | head -1)

            if [ -n "$WORKER_FILE" ]; then
              PROJECT_ROOT=$(dirname "$WORKER_FILE")
            else
              WRANGLER_FILE=$(find /tmp/ioe-project -name wrangler.toml -type f | head -1)

              if [ -n "$WRANGLER_FILE" ]; then
                PROJECT_ROOT=$(dirname "$WRANGLER_FILE")
              fi
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Could not determine project root."
            echo "ZIP contents:"
            find /tmp/ioe-project -maxdepth 4 -type f
            exit 1
          fi

          echo "Project root found:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Copy project files
        run: |
          echo "Copying project files from:"
          echo "$PROJECT_ROOT"

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='node_modules/' \
            "$PROJECT_ROOT/" ./

      - name: Show repository contents
        run: |
          echo "Repository after extraction:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort | head -200

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Extract GitHub-ready IOE Creative Studio project"
            git push
          fi
