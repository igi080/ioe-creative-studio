name: Regenerate npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove old lockfile
        run: rm -f package-lock.json

      - name: Generate fresh lockfile
        run: |
          npm install --package-lock-only --include=optional --ignore-scripts

      - name: Verify lockfile
        run: |
          npm ci --include=optional --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --cached --quiet; then
            echo "No lockfile changes."
          else
            git commit -m "Regenerate complete npm lockfile"
            git push
          fi
